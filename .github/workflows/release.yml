name: release

# 手动触发：Actions -> release -> Run workflow
# 构建安装包并自动发布成 GitHub Release（Release 必须挂在 tag 上，所以会创建 v<version>）。
# 版本号以 package.json 的 version 为准，构建前同步到 tauri.conf.json / Cargo.toml / ui。
#
# tag 规则：
#   已有同版本 Release -> 直接失败（请先升版本号）
#   只有残留 tag、没有 Release -> 把 tag 移到当前提交再发布（tag 由本流水线接管）
on:
  workflow_dispatch:
    inputs:
      draft:
        description: "保存为草稿（不立即公开）"
        type: boolean
        default: false
      prerelease:
        description: "标记为预发布（prerelease）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build & publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 读取版本号（package.json 为准）
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $v = $pkg.version
          if (-not $v) { throw "package.json 里没有 version 字段" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $v"

      - name: 检查 v${{ steps.ver.outputs.value }} 是否已发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.value }}"
          gh release view "v$v" --json tagName *> $null
          # gh 找不到 release 时返回 1；这里必须清零，否则 Actions 用 $LASTEXITCODE 收尾会判定失败
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            throw "v$v 已经发布过：请先在 package.json 里升版本号，再重新触发"
          }
          Write-Host "v$v 尚未发布，继续"

      - name: 同步版本号到 tauri.conf.json / Cargo.toml / ui
        run: node tools/scripts/set-version.mjs ${{ steps.ver.outputs.value }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: 安装前端依赖
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ui install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 构建内置插件并铺到 resources
        shell: pwsh
        run: ./tools/scripts/prepare_bundle.ps1

      - name: 打包 NSIS 安装程序（含自动更新产物）
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      - name: 收集产物与校验和
        id: out
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.value }}"
          $dir = "src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem $dir -Filter "*-setup.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "没找到安装包（$dir 为空）" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          "$hash  $($setup.Name)" | Set-Content "$($setup.FullName).sha256" -Encoding ascii
          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($setup.Name)" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT

          # 自动更新：tauri-plugin-updater 需要 latest.json（签名 + 安装包 URL）
          # Tauri v2 的 createUpdaterArtifacts=true 直接给 NSIS 安装包出 .sig，不再生成额外的 zip
          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            throw "没找到签名文件：TAURI_SIGNING_PRIVATE_KEY / PASSWORD 是否配置？"
          }
          $signature = (Get-Content $sigPath -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/$($setup.Name)"
          $manifest = [ordered]@{
            version  = $v
            notes    = "See release notes"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $signature; url = $url }
            }
          } | ConvertTo-Json -Depth 6
          $latest = Join-Path $dir "latest.json"
          # BOM 会让 serde_json 解析失败，必须写成无 BOM 的 UTF-8
          [IO.File]::WriteAllText($latest, $manifest, (New-Object System.Text.UTF8Encoding($false)))
          "latest=$latest" >> $env:GITHUB_OUTPUT
          "sig=$sigPath" >> $env:GITHUB_OUTPUT
          Write-Host "updater: $($setup.Name) + latest.json"
          "size_mb={0:N2}" -f ($setup.Length / 1MB) | Write-Host
          Write-Host "sha256: $hash"

      - name: 上传安装包（Actions 页面保留一份）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-monitor-${{ steps.ver.outputs.value }}
          path: |
            ${{ steps.out.outputs.path }}
            ${{ steps.out.outputs.path }}.sha256
            ${{ steps.out.outputs.sig }}
            ${{ steps.out.outputs.latest }}
          if-no-files-found: error
          retention-days: 90

      - name: 创建 / 移动 tag v${{ steps.ver.outputs.value }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.value }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin | Out-Null
          $old = (git rev-parse -q --verify "refs/tags/v$v") 2>$null
          if ($old) { Write-Host "tag v$v 原指向 $old，改为当前提交" }
          git tag -f "v$v" "${{ github.sha }}"
          git push -f origin "refs/tags/v$v"
          Write-Host "tag v$v -> ${{ github.sha }}"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          name: v${{ steps.ver.outputs.value }}
          generate_release_notes: true
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ steps.out.outputs.path }}
            ${{ steps.out.outputs.path }}.sha256
            ${{ steps.out.outputs.sig }}
            ${{ steps.out.outputs.latest }}
          fail_on_unmatched_files: true

      - name: 摘要
        shell: pwsh
        run: |
          @"
          ### desktop-monitor v${{ steps.ver.outputs.value }}

          - 安装包：`${{ steps.out.outputs.name }}`
          - SHA256：`${{ steps.out.outputs.hash }}`
          - Release：${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.value }}
          - Artifact（临时）：desktop-monitor-${{ steps.ver.outputs.value }}
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
