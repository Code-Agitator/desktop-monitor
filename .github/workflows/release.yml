name: release

# 手动触发：Actions -> release -> Run workflow
# 版本号以 package.json 的 version 为准，构建前会同步到 tauri.conf.json 和 Cargo.toml。
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "标记为预发布（prerelease）"
        type: boolean
        default: false
      draft:
        description: "保存为草稿（不立即公开）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build & release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 读取版本号（package.json 为准）
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $v = $pkg.version
          if (-not $v) { throw "package.json 里没有 version 字段" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $v"

      - name: 检查 tag 是否已存在
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.value }}"
          git ls-remote --exit-code --tags origin "refs/tags/v$v" *> $null
          if ($LASTEXITCODE -eq 0) { throw "tag v$v 已存在：请先在 package.json 里升版本号" }
          Write-Host "tag v$v 可用"

      - name: 同步版本号到 tauri.conf.json / Cargo.toml / ui
        run: node tools/scripts/set-version.mjs ${{ steps.ver.outputs.value }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: 安装前端依赖
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ui install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 构建内置插件并铺到 resources
        shell: pwsh
        run: ./tools/scripts/prepare_bundle.ps1

      - name: 打包 NSIS 安装程序
        shell: pwsh
        run: pnpm tauri build

      - name: 收集产物与校验和
        id: out
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.value }}"
          $dir = "src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem $dir -Filter "*-setup.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "没找到安装包（$dir 为空）" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          "$hash  $($setup.Name)" | Set-Content "$($setup.FullName).sha256" -Encoding ascii
          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($setup.Name)" >> $env:GITHUB_OUTPUT
          "size_mb={0:N2}" -f ($setup.Length / 1MB) | Write-Host
          Write-Host "sha256: $hash"

      - name: 上传构建产物（Actions 页面可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-monitor-${{ steps.ver.outputs.value }}
          path: |
            ${{ steps.out.outputs.path }}
            ${{ steps.out.outputs.path }}.sha256
          if-no-files-found: error

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          name: v${{ steps.ver.outputs.value }}
          generate_release_notes: true
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ steps.out.outputs.path }}
            ${{ steps.out.outputs.path }}.sha256
          fail_on_unmatched_files: true

      - name: 摘要
        shell: pwsh
        run: |
          @"
          ### desktop-monitor v${{ steps.ver.outputs.value }}
          - 安装包：`${{ steps.out.outputs.name }}`
          - 发布页：${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.value }}
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
